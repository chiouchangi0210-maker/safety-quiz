<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24364a">
<title>危險性設備合格證申請自檢表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef1f4; --sheet:#ffffff; --ink:#1d2a36; --muted:#5c6b78; --line:#d5dce2;
  --steel:#24364a; --steel-2:#3a5570; --pass:#23794a; --pass-bg:#e3f2e8;
  --na:#5c6b78; --na-bg:#e9edf0; --miss:#b3261e; --miss-bg:#fbe7e5; --flag:#f2c230;
  --fs:1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11181f; --sheet:#1a232c; --ink:#e4eaef; --muted:#9aa8b4; --line:#2e3b47;
    --steel:#0d151c; --steel-2:#9fc0dc; --pass:#6fcf97; --pass-bg:#16302a;
    --na:#9aa8b4; --na-bg:#25313b; --miss:#ff8a80; --miss-bg:#3a1f1d; --flag:#f2c230;
  }
}
:root[data-theme="dark"]{
  --paper:#11181f; --sheet:#1a232c; --ink:#e4eaef; --muted:#9aa8b4; --line:#2e3b47;
  --steel:#0d151c; --steel-2:#9fc0dc; --pass:#6fcf97; --pass-bg:#16302a;
  --na:#9aa8b4; --na-bg:#25313b; --miss:#ff8a80; --miss-bg:#3a1f1d;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:calc(15px*var(--fs));line-height:1.6;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--flag);outline-offset:2px}

/* masthead */
.mast{background:var(--steel);color:#fff;padding:14px 16px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.mast-in{max-width:860px;margin:0 auto}
.mast h1{margin:0;font-size:calc(17px*var(--fs));font-weight:700;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.font-btn{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:2px 10px;font-size:13px;font-weight:500}
.stages{display:grid;grid-template-columns:repeat(5,1fr);margin-top:10px}
.stage{background:none;border:0;color:rgba(255,255,255,.62);padding:8px 0 10px;font-weight:500;font-size:calc(13.5px*var(--fs));white-space:nowrap;border-bottom:4px solid transparent;position:relative}
.stage[aria-selected="true"]{color:#fff;border-bottom-color:var(--flag);font-weight:700}
.stage .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--flag);margin-left:4px;vertical-align:middle;opacity:0}
.stage.done .dot{opacity:1}

main{max-width:860px;margin:0 auto;padding:14px 12px 120px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:4px;position:relative;overflow:hidden}
.sheet-head{padding:16px 16px 12px;border-bottom:2px solid var(--ink)}
.sheet-head h2{margin:0 0 10px;padding-right:84px;font-size:calc(20px*var(--fs));font-weight:900;letter-spacing:.04em}
.equip{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:3px;padding:4px 10px;font-size:calc(14px*var(--fs));display:inline-flex;gap:6px;align-items:center}
.chip .box{width:15px;height:15px;border:1.5px solid var(--muted);border-radius:2px;display:inline-grid;place-items:center;font-size:11px;line-height:1}
.chip[aria-pressed="true"]{border-color:var(--steel-2);color:var(--ink);font-weight:700}
.chip[aria-pressed="true"] .box{background:var(--steel-2);border-color:var(--steel-2);color:var(--sheet)}
.field{display:flex;align-items:center;gap:8px;font-size:calc(14px*var(--fs))}
.field label{white-space:nowrap;color:var(--muted)}
.field input{flex:1;min-width:0;border:0;border-bottom:1.5px solid var(--line);background:transparent;padding:4px 2px;font-size:max(16px,calc(15px*var(--fs)))}
.field input:focus{outline:none;border-bottom-color:var(--steel-2)}

.tally{display:flex;gap:14px;padding:8px 16px;font-size:calc(13px*var(--fs));color:var(--muted);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tally b{color:var(--ink);font-variant-numeric:tabular-nums}
.tally .m b{color:var(--miss)}

ol.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:44px 1fr;gap:2px 10px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
.item.is-v{background:var(--pass-bg)}
.item.is-x{background:var(--miss-bg)}
.tick{grid-row:1 / span 2;width:40px;height:40px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;font-size:26px;font-weight:900;line-height:1;color:var(--pass);background:var(--sheet);transition:transform .12s}
.item.is-v .tick{border-color:var(--pass);color:var(--pass)}
.item.is-na .tick{border-color:var(--na);color:var(--na)}
.item.is-x .tick{border-color:var(--miss);color:var(--miss);font-size:20px}
.item:active .tick{transform:scale(.92)}
.head-line{display:flex;gap:6px}
.item .no{font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums}
.item .name{font-weight:500}
.item .note{grid-column:2;font-size:calc(13px*var(--fs));color:var(--muted)}
.item .note a{color:var(--steel-2)}
.res{grid-column:2;display:flex;gap:6px;margin-top:6px}
.res button{flex:0 0 auto;min-height:30px;border:1px solid var(--line);background:var(--sheet);border-radius:3px;font-weight:500;font-size:calc(13px*var(--fs));padding:1px 10px;color:var(--muted)}
.res button[data-v="V"][aria-pressed="true"]{background:var(--pass-bg);border-color:var(--pass);color:var(--pass)}
.res button[data-v="NA"][aria-pressed="true"]{background:var(--na-bg);border-color:var(--na);color:var(--na)}
.res button[data-v="X"][aria-pressed="true"]{background:var(--miss-bg);border-color:var(--miss);color:var(--miss)}
.reason{grid-column:2;margin-top:4px}
.reason input{width:100%;border:1.5px solid var(--miss);background:var(--miss-bg);border-radius:3px;padding:6px 8px;font-size:max(16px,calc(14px*var(--fs)))}
.item.custom .name{display:flex;gap:6px;align-items:center}
.del{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}

.add{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.add input{flex:1;min-width:0;border:1.5px dashed var(--line);background:transparent;border-radius:3px;padding:6px 8px;font-size:max(16px,calc(14px*var(--fs)))}
.add button{border:1.5px solid var(--steel-2);background:transparent;color:var(--steel-2);border-radius:3px;font-weight:700;padding:4px 12px;white-space:nowrap}

.remark{padding:12px 16px;font-size:calc(13px*var(--fs));color:var(--muted);border-bottom:1px solid var(--line)}
.remark p{margin:0}
.sign{padding:12px 16px 18px;display:grid;gap:10px}

/* stamp: the one memorable thing */
.stamp{position:absolute;right:14px;top:12px;width:92px;height:92px;border:3px solid var(--miss);border-radius:50%;
  color:var(--miss);display:grid;place-items:center;text-align:center;font-weight:900;font-size:19px;line-height:1.15;
  transform:rotate(-14deg) scale(1.6);opacity:0;pointer-events:none;mix-blend-mode:multiply}
.stamp::before{content:"";position:absolute;inset:4px;border:1px solid var(--miss);border-radius:50%}
.stamp small{display:block;font-size:10px;font-weight:700;margin-top:2px}
.sheet.complete .stamp{opacity:.85;transform:rotate(-14deg) scale(1);transition:transform .28s cubic-bezier(.3,1.6,.5,1),opacity .2s}
@media (prefers-color-scheme:dark){.stamp{mix-blend-mode:normal}}
@media (prefers-reduced-motion:reduce){.sheet.complete .stamp{transition:none}}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.bar-in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.bar button{min-height:42px;border-radius:3px;font-weight:700;border:1.5px solid var(--line);background:transparent}
.bar .primary{background:var(--steel-2);border-color:var(--steel-2);color:var(--sheet)}
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);
  padding:6px 14px;border-radius:4px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:6}
.toast.show{opacity:1}



/* photos */
.photo-head{padding:16px 16px 12px;border-bottom:2px solid var(--ink)}
.photo-head h2{margin:0 0 4px;font-size:calc(20px*var(--fs));font-weight:900;letter-spacing:.04em}
.photo-head p{margin:0 0 12px;color:var(--muted);font-size:calc(13px*var(--fs))}
.shoot{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.shoot label{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border-radius:4px;font-weight:700;cursor:pointer;border:1.5px solid var(--steel-2)}
.shoot label.cam{background:var(--steel-2);color:var(--sheet)}
.shoot label.lib{color:var(--steel-2)}
.shoot input{position:absolute;width:1px;height:1px;opacity:0}
.photos{list-style:none;margin:0;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ph-card{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--sheet);display:flex;flex-direction:column}
.ph-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--na-bg);cursor:zoom-in}
.ph-meta{padding:6px 8px 8px;display:grid;gap:5px}
.ph-meta select,.ph-meta input{width:100%;border:1px solid var(--line);border-radius:3px;background:transparent;padding:4px 6px;font-size:max(16px,calc(13px*var(--fs)))}
.ph-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:none;place-items:center;padding:12px}
.viewer.open{display:grid}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.busy{padding:10px 16px;color:var(--muted);font-size:13px;display:none}
.busy.on{display:block}

/* print = the paper form */
.print-only{display:none}
/* paper document (preview + print) */
.paper{width:688px;background:#fff;color:#000;font-size:11pt;line-height:1.5;padding:0}
.paper-in{position:relative}
.paper table.pf{width:100%;border-collapse:collapse;font-size:10.5pt}
.paper .pf th,.paper .pf td{border:1px solid #000;padding:5px 6px;vertical-align:top;text-align:left}
.paper .pf th{background:#eee}
.paper .pf td.c{text-align:center;width:4.5em}
.paper .pf td.n{text-align:center;width:2.6em}
.paper .ph h2{text-align:center;font-size:15pt;margin:0 0 8px}
.paper .ph p{margin:2px 0}
.paper .pfoot{margin-top:8px}
.paper .pfoot p{margin:3px 0}
.paper .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8mm}
.paper .pgrid figure{margin:0;break-inside:avoid;border:1px solid #000;padding:3mm}
.paper .pgrid img{width:100%;height:62mm;object-fit:contain;display:block}
.paper .pgrid figcaption{font-size:10pt;margin-top:2mm}
.ink{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.ink path,.ink line,.ink rect,.ink ellipse{fill:none;stroke-linecap:round;stroke-linejoin:round}

/* annotate preview */
.pv{position:fixed;inset:0;z-index:30;background:#5b6670;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.pv.open{display:block}
.pv-stage{padding:64px 0 40px;display:flex;justify-content:center}
.pv-scale{transform-origin:top left}
.pv .paper{box-shadow:0 2px 14px rgba(0,0,0,.35);padding:14mm;box-sizing:content-box}
.pv.drawing .ink{touch-action:none;cursor:crosshair}
.pv:not(.drawing) .ink{pointer-events:none}
.tools{position:fixed;top:0;right:0;left:0;z-index:31;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px;background:rgba(36,54,74,.96)}
.tools button{min-height:36px;min-width:36px;border:0;border-radius:18px;background:rgba(255,255,255,.95);color:#1d2a36;font-weight:700;font-size:14px;padding:0 11px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.tools button[aria-pressed="true"]{outline:3px solid var(--flag);outline-offset:-3px}
.tools .sw{width:36px;padding:0}
.tools .sw span{display:inline-block;width:20px;height:20px;border-radius:50%;vertical-align:middle}
.tools .go{background:#3a5570;color:#fff}
.tools .sep{width:100%;height:0}
@media (min-width:700px){.tools .sep{display:none}}

@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  body > *:not(#pv){display:none!important}
  .pv{position:static;display:block!important;overflow:visible;background:#fff}
  .tools{display:none!important}
  .pv-stage{padding:0;display:block}
  .pv-scale{transform:none!important;width:auto!important;height:auto!important}
  .pv .paper{box-shadow:none;padding:0}
}
}
</style>
</head>
<body>
<header class="mast">
  <div class="mast-in">
    <h1><span>危險性設備合格證申請自檢表</span><button id="fontBtn" class="font-btn" type="button">字級</button></h1>
    <nav class="stages" role="tablist" id="stages"></nav>
  </div>
</header>

<main>
  <section class="sheet" id="sheet">
    <div class="stamp" aria-hidden="true"><div>資料<br>齊備<small id="stampDate"></small></div></div>
    <div class="screen-only" id="checkView">
      <div class="sheet-head">
        <h2 id="title"></h2>
        <div class="equip" id="equip"></div>
        <div class="field"><label for="equipNo">設備編號</label><input id="equipNo" autocomplete="off" placeholder="輸入設備編號"></div>
      </div>
      <div class="tally" id="tally"></div>
      <ol class="items" id="items"></ol>
      <div class="add">
        <input id="newItem" placeholder="新增其他檢附資料" autocomplete="off">
        <button type="button" id="addBtn">新增</button>
      </div>
      <div class="remark">
        <p>1. 檢附資料若為影本，需蓋「事業單位」章及「與正本相符」章。</p>
        <p>2. 點一下項目就會打勾「✓」（符合），再點一次取消；無該項目者點「／ 無此項」，檢附資料不齊全者點「不齊全」並寫明原因。</p>
      </div>
      <div class="sign">
        <div class="field"><label for="contact">事業單位聯絡人及電話</label><input id="contact" autocomplete="off"></div>
        <div class="field"><label for="officer">承辦人</label><input id="officer" autocomplete="off"></div>
      </div>
    </div>
    <div class="screen-only" id="photoView" hidden>
      <div class="photo-head">
        <h2>照片</h2>
        <p>現場或文件照片，可標註屬於哪一項檢查。照片只存在這支手機上。</p>
        <div class="shoot">
          <label class="cam">📷 拍照<input type="file" id="camInput" accept="image/*" capture="environment"></label>
          <label class="lib">從相簿選<input type="file" id="libInput" accept="image/*" multiple></label>
        </div>
      </div>
      <div class="busy" id="busy">照片處理中…</div>
      <ul class="photos" id="photos"></ul>
    </div>
    <div class="print-only" id="printView"></div>
  </section>
</main>

<footer class="bar">
  <div class="bar-in">
    <button type="button" id="resetBtn">清除本表</button>
    <button type="button" id="copyBtn">複製缺件清單</button>
    <button type="button" class="primary" id="printBtn">列印 / 存PDF</button>
  </div>
</footer>
<div class="toast" id="toast" role="status"></div>
<div class="viewer" id="viewer"><img alt="照片放大"></div>
<div class="pv" id="pv" aria-label="列印預覽與標註">
  <div class="tools" id="tools">
    <button type="button" data-mode="pen" aria-pressed="true" title="自由畫">✏️</button>
    <button type="button" data-mode="line" aria-pressed="false" title="直線">╱ 直線</button>
    <button type="button" data-mode="rect" aria-pressed="false" title="框">▢ 框</button>
    <button type="button" data-mode="ellipse" aria-pressed="false" title="圈">◯ 圈</button>
    <button type="button" data-mode="move" aria-pressed="false" title="捲動畫面">✋ 移動</button>
    <span class="sep"></span>
    <button type="button" class="sw" data-color="#d32f2f" aria-pressed="true" title="紅"><span style="background:#d32f2f"></span></button>
    <button type="button" class="sw" data-color="#1565c0" aria-pressed="false" title="藍"><span style="background:#1565c0"></span></button>
    <button type="button" class="sw" data-color="#111111" aria-pressed="false" title="黑"><span style="background:#111"></span></button>
    <button type="button" id="widthBtn" title="線條粗細">細</button>
    <button type="button" id="undoBtn" title="復原">↶ 復原</button>
    <button type="button" id="inkClear" title="清除標註">清除</button>
    <button type="button" id="pvClose">關閉</button>
    <button type="button" class="go" id="pvPrint">列印 / 存PDF</button>
  </div>
  <div class="pv-stage"><div class="pv-scale" id="pvScale"><div class="paper" id="paper"><div class="paper-in"><div id="paperDoc"></div><svg class="ink" id="ink" xmlns="http://www.w3.org/2000/svg"></svg></div></div></div></div>
</div>

<script>
const LAW = "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0060039";
const FORMS = [
  { key:"type", tab:"型式檢查", title:"申請型式檢查檢附資料一覽表", items:[
    ["型式檢查申請書","依內容填列並加蓋事業單位章",true],
    ["申請型式檢查之高壓氣體特定設備型式、構造詳圖及強度計算書。","由事業單位提供"],
    ["製造、檢查設備之種類、能力及數量。"],
    ["主任設計者學經歷概要。"],
    ["施工負責人學經歷概要。"],
    ["施工者資格及人數。"],
    ["以熔接製造者，應檢附熔接人員資格證件、熔接程序規範及熔接程序資格檢定紀錄。"]
  ]},
  { key:"weld", tab:"熔接檢查", title:"申請熔接檢查檢附資料一覽表", items:[
    ["熔接檢查申請書","依內容填列並加蓋事業單位章"],
    ["材質證明一份。","由事業單位提供"],
    ["熔接明細表二份及施工位置分類圖一份。"],
    ["構造詳圖及強度計算書各二份。"],
    ["熔接施工人員之熔接技術士資格證件。"],
    ["製造設施型式檢查合格證明、熔接程序規範及熔接程序資格檢定紀錄等影本各一份。"]
  ]},
  { key:"struct", tab:"構造檢查", title:"申請構造檢查檢附資料一覽表", items:[
    ["構造檢查申請書","依內容填列並加蓋事業單位章"],
    ["高壓氣體特定設備明細表二份。","由事業單位提供"],
    ["構造詳圖及強度計算書各二份。"],
    ["以熔接製造者，附加蓋熔接檢查合格戳記之熔接明細表。"],

const ink = $("ink"), pv = $("pv");

function inkStore(){

function shapeSvg(o){
  const a = `stroke="${o.c}" stroke-width="${o.w}"`;
  if (o.t==="pen") return `<path ${a} d="M${o.p.map(q=>q.join(",")).join(" L")}"/>`;
  const [x1,y1] = o.p[0], [x2,y2] = o.p[o.p.length-1];
  if (o.t==="line") return `<line ${a} x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  if (o.t==="rect") return `<rect ${a} x="${Math.min(x1,x2)}" y="${Math.min(y1,y2)}" width="${Math.abs(x2-x1)}" height="${Math.abs(y2-y1)}"/>`;
  return `<ellipse ${a} cx="${(x1+x2)/2}" cy="${(y1+y2)/2}" rx="${Math.abs(x2-x1)/2}" ry="${Math.abs(y2-y1)/2}"/>`;
}
function drawInk(extra){
  ink.innerHTML = inkStore().map(shapeSvg).join("") + (extra ? shapeSvg(extra) : "");
}
function fit(){

function pt(e){
  const r = ink.getBoundingClientRect(), k = r.width / ink.clientWidth || 1;
  return [Math.round((e.clientX - r.left)/k*10)/10, Math.round((e.clientY - r.top)/k*10)/10];
}
ink.addEventListener("pointerdown", e => {
  if (mode==="move") return;
  e.preventDefault(); ink.setPointerCapture(e.pointerId);
  drawing = { t:mode, c:color, w:widths[wi], p:[pt(e)] };
});
ink.addEventListener("pointermove", e => {
  if (!drawing) return; e.preventDefault();
  const q = pt(e);
  if (drawing.t==="pen") drawing.p.push(q); else drawing.p[1] = q;
  drawInk(drawing);
});
function endStroke(){
  if (!drawing) return;
  if (drawing.p.length > 1) { inkStore().push(drawing); save(); }
  drawing = null; drawInk();
}

let photos = [];

const fmtTime = t => { const d = new Date(t); return `${d.getFullYear()-1911}.${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
function db(){
  return new Promise((ok, no) => {
    const r = indexedDB.open("equip-cert-photos", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("photos", { keyPath:"id" });
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  });
}
async function tx(mode, fn){
  const d = await db();
  return new Promise((ok, no) => {
    const t = d.transaction("photos", mode), st = t.objectStore("photos");
    const out = fn(st);
    t.oncomplete = () => ok(out && out.result); t.onerror = () => no(t.error);
  });
}
const dbAll = () => tx("readonly", st => st.getAll());
const dbPut = p => tx("readwrite", st => st.put(p));
const dbDel = id => tx("readwrite", st => st.delete(id));
const dbClear = () => tx("readwrite", st => st.clear());

function shrink(file){
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.78));
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error("無法讀取這張照片")); };
    img.src = url;
  });
}

$("photos").addEventListener("click", async e => {
  const d = e.target.closest("[data-pdel]");
  if (d) { if (!confirm("刪除這張照片？")) return; await dbDel(d.dataset.pdel); photos = photos.filter(p => p.id!==d.dataset.pdel); render(); return; }
  const img = e.target.closest("img");
  if (img) { $("viewer").querySelector("img").src = img.src; $("viewer").classList.add("open"); }
});
$("viewer").addEventListener("click", () => $("viewer").classList.remove("open"));
let saveT;
$("photos").addEventListener("input", e => {
  const card = e.target.closest(".ph-card"), f = e.target.dataset.f; if (!card || !f) return;
  const p = photos.find(x => x.id===card.dataset.id); p[f] = e.target.value;
  clearTimeout(saveT); saveT = setTimeout(() => dbPut(p), 300); renderPrint();
});
$("photos").addEventListener("change", e => { if (e.target.dataset.f==="form") e.target.dispatchEvent(new Event("input", { bubbles:true })); });
async function sharePhotos(){
  if (!photos.length) { toast("還沒有照片"); return; }
  try {
    const files = await Promise.all(photos.map(async (p, n) => {
      const b = await (await fetch(p.data)).blob();
      return new File([b], `照片${n+1}_${tabName(p.form)}${p.caption?"_"+p.caption.replace(/[\\/:*?"<>|]/g,""):""}.jpg`, { type:"image/jpeg" });
    }));
    if (navigator.canShare && navigator.canShare({ files })) { await navigator.share({ files, title:"設備檢查照片" }); }
    else toast("這個瀏覽器不支援分享，請用「列印 / 存PDF」");
  } catch (e) { if (e.name!=="AbortError") toast("分享失敗，請用「列印 / 存PDF」"); }
}
dbAll().then(list => { photos = (list || []).sort((a,b) => b.time - a.time); render(); }).catch(() => {});

render();
</script>
</body>
</html>
