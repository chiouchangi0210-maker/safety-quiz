<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>危險性工作場所安衛測驗</title>
  <meta name="theme-color" content="#126c67">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="安衛填充測驗">
  <link rel="manifest" href="dwp.webmanifest">
  <link rel="icon" href="dwp-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="dwp-apple-touch-icon.png">
  <style>
    :root {
      color-scheme: light;
      --ink: #1d252f;
      --muted: #607083;
      --line: #d9e1ea;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --primary: #126c67;
      --primary-ink: #ffffff;
      --accent: #b03a2e;
      --ok: #1f7a4d;
      --bad: #b3261e;
      --warn: #8a5a00;
      --shadow: 0 10px 30px rgba(21, 37, 51, .08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
      font-size: calc(16px * var(--fs, 1));
    }

    button, input, select { font: inherit; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 14px;
      min-height: calc(46px * var(--fs, 1));
      background: #e9eef4;
      color: var(--ink);
      font-weight: 700;
    }
    button.primary { background: var(--primary); color: var(--primary-ink); }
    button.warn { background: #fff3d6; color: var(--warn); }
    button.ghost { background: transparent; border: 1px solid var(--line); }
    button:disabled { opacity: .45; }

    .app {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(246, 248, 251, .94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      padding: 12px 14px 10px;
    }
    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
    }
    h1 {
      margin: 0;
      font-size: calc(18px * var(--fs, 1));
      line-height: 1.25;
      letter-spacing: 0;
    }
    .status-pill {
      flex: 0 0 auto;
      border-radius: 999px;
      background: #e8f4f2;
      color: #07534f;
      padding: 6px 10px;
      font-size: calc(13px * var(--fs, 1));
      font-weight: 800;
    }
    .progress {
      margin-top: 10px;
      height: 8px;
      border-radius: 999px;
      background: #dfe6ee;
      overflow: hidden;
    }
    .progress > div {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #126c67, #5a7f2f);
    }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .toolbar select {
      width: 100%;
      min-height: calc(44px * var(--fs, 1));
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      background: #fff;
      color: var(--ink);
    }
    main {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      padding: 14px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: calc(13px * var(--fs, 1));
      font-weight: 700;
      margin-bottom: 12px;
    }
    .question {
      font-size: calc(18px * var(--fs, 1));
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .answers {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }
    .answer-row {
      display: grid;
      grid-template-columns: 42px 1fr;
      align-items: center;
      gap: 10px;
    }
    .answer-row label {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #eef4f7;
      color: var(--muted);
      font-weight: 800;
    }
    .answer-row input {
      width: 100%;
      min-height: calc(48px * var(--fs, 1));
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      background: #fff;
      color: var(--ink);
      font-size: calc(18px * var(--fs, 1));
    }
    .answer-row.correct input { border-color: rgba(31, 122, 77, .7); background: #f0faf5; }
    .answer-row.wrong input { border-color: rgba(179, 38, 30, .7); background: #fff4f3; }
    .feedback {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: #f0f4f8;
      color: var(--muted);
      font-weight: 700;
      min-height: calc(48px * var(--fs, 1));
    }
    .feedback.ok { background: #edf8f2; color: var(--ok); }
    .feedback.bad { background: #fff1ef; color: var(--bad); }
    .footer {
      position: sticky;
      bottom: 0;
      z-index: 4;
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(14px);
      padding: 10px 14px max(10px, env(safe-area-inset-bottom));
    }
    .actions {
      max-width: 780px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }
    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
    }
    .stat b { display: block; font-size: calc(22px * var(--fs, 1)); line-height: 1.2; }
    .stat span { color: var(--muted); font-size: calc(12px * var(--fs, 1)); font-weight: 700; }
    .locked {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 18px;
      background: var(--bg);
    }
    .locked .panel {
      width: min(100%, 480px);
    }
    .locked input {
      width: 100%;
      min-height: calc(48px * var(--fs, 1));
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      margin: 12px 0;
    }
    input { font-size: max(var(--inmin, 16px), calc(17px * var(--fs, 1))) !important; }
    .font-btn {
      min-height: 32px;
      padding: 4px 10px;
      font-size: 13px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      white-space: nowrap;
    }
    .title-tools { display: flex; gap: 6px; align-items: center; }
    .blank {
      display: inline-block;
      margin: 0 2px;
      padding: 0 6px;
      border-radius: 6px;
      background: #fff3d6;
      color: var(--accent);
      font-weight: 800;
      white-space: nowrap;
    }
    .blank b { display: inline-block; min-width: 2.2em; text-align: center; border-bottom: 2px solid var(--accent); }
    .q-head { display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 8px; }
    .q-head span { font-size: calc(12px * var(--fs, 1)); font-weight:700; padding:2px 8px; border-radius:999px; background:#e8f1f0; color:#126c67; }
    .q-head span.art { background:#fff3d6; color:#8a5a00; }
    .q-ctx { margin:0 0 8px; padding:8px 10px; border-left:3px solid #c9d4dc; background:#f6f8fa; color:#5c6b78; border-radius:0 6px 6px 0; font-size: calc(14px * var(--fs, 1)); line-height:1.6; }
    .q-ctx p { margin:0; }
    .q-ctx p + p { margin-top:4px; }
    .q-ctx:empty { display:none; }
    .toolbar #chapter { grid-column: 1 / -1; }
    .search { grid-column: 1 / -1; position: relative; }
    .search input { width: 100%; min-height: calc(40px * var(--fs, 1)); border: 1px solid var(--line); border-radius: 8px; padding: 0 36px 0 34px; background: #fff; color: var(--ink); font-size: max(16px, calc(15px * var(--fs, 1))) !important; }
    .search::before { content: "🔍"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: .6; }
    .search button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: none; font-size: 18px; color: #6b7785; min-height: 32px; padding: 0 8px; }
    .search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
    .search-note { grid-column: 1 / -1; margin: -2px 0 0; font-size: 12px; color: #b3261e; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .search-note:empty { display: none; }

    /* 題型切換 */
    .types { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:8px 12px 0; background:#fff; }
    .types button { min-height:38px; border:1px solid var(--line); border-radius:8px; background:#fff; font-weight:700; color:var(--muted); }
    .types button[aria-pressed="true"] { background:#126c67; border-color:#126c67; color:#fff; }
    body.alt .toolbar, body.alt main#fillMain, body.alt footer#fillFooter, body.alt #scorePill { display:none !important; }
    #altMain { display:none; }
    body.alt #altMain { display:block; }
    .alt-panel h2 { margin:4px 0 4px; font-size:calc(17px * var(--fs,1)); }
    .alt-hint { margin:0 0 10px; color:var(--muted); font-size:calc(13px * var(--fs,1)); }
    .mgrid { display:grid; grid-template-columns: minmax(0,.85fr) minmax(0,1.15fr); gap:8px; }
    .mcol { display:grid; gap:8px; align-content:start; }
    .mi { position:relative; text-align:left; border:1.5px solid var(--line); background:#fff; border-radius:8px; padding:8px 8px 8px 30px; min-height:44px; font-size:calc(14px * var(--fs,1)); line-height:1.45; color:var(--ink); }
    .mi .tag { position:absolute; left:6px; top:8px; width:18px; height:18px; border-radius:50%; font-size:11px; font-weight:800; display:grid; place-items:center; background:#e9edf1; color:#7a8794; }
    .mi.sel { border-color:#126c67; box-shadow:0 0 0 2px rgba(18,108,103,.25); }
    .mi.ok { border-color:#23794a; background:#e3f2e8; }
    .mi.bad { border-color:#b3261e; background:#fbe7e5; }
    .mi .fix { display:block; margin-top:4px; font-size:12px; color:#23794a; font-weight:700; }
    .olist { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
    .oi { display:grid; grid-template-columns:28px 1fr 40px; gap:6px; align-items:center; border:1.5px solid var(--line); border-radius:8px; padding:6px; background:#fff; font-size:calc(14px * var(--fs,1)); line-height:1.45; }
    .oi .n { width:26px; height:26px; border-radius:50%; background:#126c67; color:#fff; display:grid; place-items:center; font-weight:800; font-size:13px; }
    .oi .mv { display:grid; gap:4px; }
    .oi .mv button { min-height:30px; border:1px solid var(--line); border-radius:6px; background:#f6f8fa; font-size:13px; padding:0; }
    .oi.ok { border-color:#23794a; background:#e3f2e8; }
    .oi.bad { border-color:#b3261e; background:#fbe7e5; }
    .oi .fix { display:block; font-size:12px; color:#b3261e; font-weight:700; }
    .cl { border:1.5px solid var(--line); border-radius:8px; padding:8px; background:#fff; }
    .cl.ok { border-color:#23794a; background:#e3f2e8; } .cl.bad { border-color:#b3261e; background:#fbe7e5; }
    .cl-t { font-size:calc(14px * var(--fs,1)); line-height:1.5; margin-bottom:6px; }
    .cl-f { display:flex; flex-wrap:wrap; align-items:center; gap:4px 6px; margin-top:4px; }
    .cl-n { font-size:12px; color:var(--muted); font-weight:700; min-width:4.5em; }
    .cl-o { display:flex; flex-wrap:wrap; gap:4px; }
    .chip { min-height:30px; padding:2px 9px; border:1px solid var(--line); border-radius:999px; background:#fff; font-size:calc(13px * var(--fs,1)); font-weight:600; color:var(--ink); }
    .chip.on { background:#126c67; border-color:#126c67; color:#fff; }
    .mopts { display:grid; gap:5px; }
    .mopt { text-align:left; border:1.5px solid var(--line); border-radius:8px; background:#fff; padding:7px 9px; min-height:38px; font-size:calc(13.5px * var(--fs,1)); font-weight:500; line-height:1.45; color:var(--ink); }
    .mopt.on { border-color:#126c67; background:#e8f1f0; font-weight:700; }
    .mopt.right { border-color:#23794a; } .mopt.wrong { border-color:#b3261e; background:#fbe7e5; }
    .mopt b { color:#23794a; } .mopt.wrong b { color:#b3261e; }
    .cl .fix { font-size:12px; color:#b3261e; font-weight:700; }
    .alt-actions { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
    .alt-actions button { min-height:42px; padding:6px 8px; }
    .alt-fb { margin:12px 0; padding:10px 12px; border-radius:8px; background:#f1f4f7; font-weight:700; font-size:calc(14px * var(--fs,1)); }
    .alt-fb.good { background:#e3f2e8; color:#23794a; } .alt-fb.bad { background:#fbe7e5; color:#b3261e; }
    .hidden { display: none !important; }
    /* 底部按鈕：兩列 */
    .footer { padding: 6px 10px max(6px, env(safe-area-inset-bottom)); }
    .actions {
      grid-template-columns: repeat(6, 1fr);
      grid-template-areas: "prev prev grade grade next next" "show show show reset reset reset";
      gap: 6px;
    }
    .actions button { min-height: 40px; padding: 6px 8px; }
    #prevBtn { grid-area: prev; }
    #gradeBtn { grid-area: grade; }
    #nextBtn { grid-area: next; }
    #showBtn { grid-area: show; }
    #resetBtn { grid-area: reset; }
    body.typing #showBtn, body.typing #resetBtn { display: none; }
    @media (max-width: 430px) {
      .summary { grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .stat { padding: 6px 8px; }
      main { padding: 10px; }
      .panel { padding: 12px; }
      header { padding: 8px 12px 8px; }
      .toolbar { padding: 8px 12px; }
    }
  </style>
</head>
<body>
  <section id="locked" class="locked hidden">
    <div class="panel">
      <h1>危險性工作場所安衛測驗</h1>
      <p id="lockMessage"></p>
      <input id="accessCode" inputmode="numeric" autocomplete="one-time-code" placeholder="輸入授權碼">
      <button id="unlockBtn" class="primary">啟用</button>
    </div>
  </section>

  <section id="app" class="app hidden">
    <header>
      <div class="title-row">
        <h1>危險性工作場所安衛測驗</h1>
        <div class="title-tools">
          <button id="fontBtn" class="font-btn" type="button">字級</button>
          <div id="scorePill" class="status-pill">0 / 0</div>
        </div>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
      <div id="verLine" style="margin-top:4px;font-size:11px;color:#6b7785;text-align:right"></div>
    </header>
    <div class="types" role="tablist">
      <button type="button" data-type="fill" aria-pressed="true">填充</button>
      <button type="button" data-type="match" aria-pressed="false">連連看</button>
      <button type="button" data-type="order" aria-pressed="false">排序</button>
    </div>
    <div class="toolbar">
      <select id="chapter"><option value="">全部章節</option></select>
      <select id="mode">
        <option value="all">全部題目</option>
        <option value="wrong">錯題重練</option>
        <option value="unanswered">未作答</option>
      </select>
      <select id="order">
        <option value="normal">依原順序</option>
        <option value="shuffle">隨機順序</option>
      </select>
      <div class="search">
        <input id="search" type="search" placeholder="搜尋條號或關鍵字，例如 17 或 製程修改" autocomplete="off" enterkeyhint="search">
        <button id="searchClear" type="button" aria-label="清除搜尋" hidden>×</button>
      </div>
      <p id="searchNote" class="search-note"></p>
    </div>
    <main id="fillMain">
      <section class="panel">
        <div class="meta">
          <span id="counter"></span>
          <span id="slotCount"></span>
          <span id="sourceRow"></span>
        </div>
        <div id="qHead" class="q-head"></div>
        <div id="qCtx" class="q-ctx"></div>
        <div id="question" class="question"></div>
        <div id="answers" class="answers"></div>
        <div id="feedback" class="feedback">填完後按「判分」。</div>
        <div class="summary">
          <div class="stat"><b id="answeredStat">0</b><span>已判分題目</span></div>
          <div class="stat"><b id="correctStat">0</b><span>答對填空</span></div>
          <div class="stat"><b id="wrongStat">0</b><span>答錯填空</span></div>
        </div>
      </section>
    </main>
    <main id="altMain">
      <section class="panel alt-panel">
        <div class="meta"><span id="altCounter"></span><span id="altArt"></span></div>
        <div id="altHead" class="q-head"></div>
        <h2 id="altTitle"></h2>
        <p id="altHint" class="alt-hint"></p>
        <div id="altBody"></div>
        <div id="altFb" class="alt-fb">作答後按「判分」。</div>
        <div class="alt-actions">
          <button id="altPrev" class="ghost" type="button">上一組</button>
          <button id="altGrade" class="primary" type="button">判分</button>
          <button id="altNext" class="ghost" type="button">下一組</button>
          <button id="altShow" class="warn" type="button" style="grid-column:span 1">看答案</button>
          <button id="altReset" type="button" style="grid-column:span 2">重來</button>
        </div>
      </section>
    </main>
    <footer class="footer" id="fillFooter">
      <div class="actions">
        <button id="prevBtn" class="ghost">上一題</button>
        <button id="nextBtn" class="ghost">下一題</button>
        <button id="gradeBtn" class="primary">判分</button>
        <button id="showBtn" class="warn">看答案</button>
        <button id="resetBtn">重來</button>
      </div>
    </footer>
  </section>

  <script>
    const CONFIG = {
      expiryDate: "2027-12-31",
      accessCode: "114196",
      requireAccessCode: false
    };

    const STORAGE_KEY = "dwp-fill-exam-v1";
    let state = loadState();
    let activeIds = QUESTIONS.map(q => q.id);
    let current = 0;
    let appBound = false;

    // 清掉已刪除題目（重複題）的舊作答紀錄，避免統計數字偏差
    (function pruneState() {
      const valid = new Set(QUESTIONS.map(q => String(q.id)));
      ["answers", "results"].forEach(key => {
        Object.keys(state[key] || {}).forEach(id => {
          if (!valid.has(String(id))) delete state[key][id];
        });
      });
    })();

    // 把題目裡的 ( ) 換成醒目的編號空格（　１　），對應下方答案欄
    function formatBlanks(text) {
      const esc = String(text).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      let n = 0;
      return esc.replace(/[（(]\s*[)）]/g, () => `<span class="blank">（<b>${++n}</b>）</span>`);
    }

    function todayIso() {
      const now = new Date();
      const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10);
    }

    // 國字數字（如 三十、一百五十、五千）轉成阿拉伯數字，兩種寫法都算對
    function cn2num(t) {
      const D = { 零:0, 〇:0, 一:1, 二:2, 兩:2, 三:3, 四:4, 五:5, 六:6, 七:7, 八:8, 九:9 }, U = { 十:10, 百:100, 千:1000 };
      if (!/^[零〇一二兩三四五六七八九十百千萬]+$/.test(t)) return t;
      let total = 0, sec = 0, num = 0;
      for (const c of t) {
        if (c in D) num = D[c];
        else if (c in U) { sec += (num || 1) * U[c]; num = 0; }
        else if (c === "萬") { total += (sec + num) * 10000; sec = 0; num = 0; }
      }
      return String(total + sec + num);
    }
    function normalize(v) {
      return cn2num(String(v || "").trim().replace(/\s+/g, ""))
        .trim()
        .replace(/\s+/g, "")
        .replace(/：/g, ":")
        .replace(/／/g, "/")
        .replace(/．/g, ".")
        .replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 65248));
    }

    function loadState() {
      try {
        const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (s && typeof s === "object") {
          return { answers: s.answers || {}, results: s.results || {}, unlocked: !!s.unlocked };
        }
      } catch {}
      return { answers: {}, results: {}, unlocked: false };
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch {}
    }

    function isExpired() {
      return todayIso() > CONFIG.expiryDate;
    }

    const APP_VERSION = "2026.11.06-12";
    document.getElementById("verLine").textContent = `版本 ${APP_VERSION}｜使用期限 ${CONFIG.expiryDate}`;

    function boot() {
      if (isExpired()) {
        showLocked(`使用期限已到期：${CONFIG.expiryDate}`, false);
        return;
      }
      if (CONFIG.requireAccessCode && !state.unlocked) {
        showLocked(`請輸入授權碼。使用期限：${CONFIG.expiryDate}`, true);
        return;
      }
      document.getElementById("locked").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      if (!appBound) {
        bind();
        appBound = true;
      }
      rebuildActiveIds();
      render();
    }

    function showLocked(message, allowUnlock) {
      document.getElementById("lockMessage").textContent = message;
      document.getElementById("accessCode").classList.toggle("hidden", !allowUnlock);
      document.getElementById("unlockBtn").classList.toggle("hidden", !allowUnlock);
      document.getElementById("locked").classList.remove("hidden");
      document.getElementById("app").classList.add("hidden");
    }

    // 授權碼按鈕在鎖定畫面就要能用，所以獨立綁定，不放在 bind() 裡
    function tryUnlock() {
      if (document.getElementById("accessCode").value.trim() === CONFIG.accessCode) {
        state.unlocked = true;
        saveState();
        boot();
      } else {
        document.getElementById("lockMessage").textContent = "授權碼不正確。";
      }
    }
    document.getElementById("unlockBtn").onclick = tryUnlock;
    document.getElementById("accessCode").addEventListener("keydown", e => {
      if (e.key === "Enter") tryUnlock();
    });

    function bind() {
      document.getElementById("prevBtn").onclick = () => { current = Math.max(0, current - 1); render(); };
      document.getElementById("nextBtn").onclick = () => { current = Math.min(activeIds.length - 1, current + 1); render(); };
      document.getElementById("gradeBtn").onclick = gradeCurrent;
      document.getElementById("showBtn").onclick = showAnswers;
      document.getElementById("resetBtn").onclick = resetAll;
      const chapSel = document.getElementById("chapter");
      [...new Set(QUESTIONS.map(q => q.law || ""))].forEach(law => {
        const grp = document.createElement("optgroup"); grp.label = law || "全部";
        [...new Set(QUESTIONS.filter(q => (q.law || "") === law).map(q => q.chapter))].forEach(c => {
          const n = QUESTIONS.filter(q => q.chapter === c).length;
          grp.appendChild(new Option(`${c}（${n} 題）`, c));
        });
        chapSel.appendChild(grp);
      });
      chapSel.onchange = () => { current = 0; rebuildActiveIds(); render(); document.getElementById("searchClear").click(); };
      const sIn = document.getElementById("search"), sClr = document.getElementById("searchClear"), sNote = document.getElementById("searchNote");
      let sT, hits = [], hitAt = 0;
      // 搜尋＝跳到符合的題目；上一題、下一題仍可在全部題目間移動
      function doSearch(){
        const kw = sIn.value.trim();
        hits = []; hitAt = 0; sNote.innerHTML = "";
        if (!kw) return;
        const artKey = (kw.match(/^第?\s*(\d+(?:-\d+)?)\s*條?$/) || [])[1];
        hits = activeIds.map((id, i) => [QUESTIONS.find(q => q.id === id), i]).filter(([q]) =>
          artKey ? q.article.replace(/[第條\s]/g, "") === artKey
                 : (q.question + (q.context || []).join("")).includes(kw)).map(([, i]) => i);
        if (!hits.length) { sNote.textContent = artKey ? `找不到第 ${artKey} 條的題目` : `找不到含「${kw}」的題目`; return; }
        current = hits[0]; render(); showHits();
      }
      function showHits(){
        const kw = sIn.value.trim(), artKey = (kw.match(/^第?\s*(\d+(?:-\d+)?)\s*條?$/) || [])[1];
        const label = artKey ? `第 ${artKey} 條` : `「${kw}」`;
        const list = hits.map(i => i + 1);
        const range = list.length > 1 && list[list.length-1] - list[0] === list.length - 1 ? `第 ${list[0]}～${list[list.length-1]} 題` : `第 ${list.join("、")} 題`;
        sNote.innerHTML = `<span style="color:#126c67">${label}共 ${hits.length} 題（${range}）</span>` +
          (hits.length > 1 ? ` <button type="button" id="nextHit" style="border:1px solid #126c67;background:#fff;color:#126c67;border-radius:999px;padding:1px 10px;font-size:12px;min-height:26px">下一個符合 ▸</button>` : "");
        const nb = document.getElementById("nextHit");
        if (nb) nb.onclick = () => { hitAt = (hitAt + 1) % hits.length; current = hits[hitAt]; render(); };
      }
      sIn.addEventListener("input", () => {
        sClr.hidden = !sIn.value;
        clearTimeout(sT); sT = setTimeout(doSearch, 400);
      });
      sIn.addEventListener("keydown", e => { if (e.key === "Enter") { clearTimeout(sT); doSearch(); sIn.blur(); } });
      sClr.onclick = () => { sIn.value = ""; sClr.hidden = true; hits = []; sNote.innerHTML = ""; };
      document.getElementById("mode").onchange = () => { current = 0; rebuildActiveIds(); render(); };
      document.getElementById("order").onchange = () => { current = 0; rebuildActiveIds(); render(); };
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function rebuildActiveIds() {
      const mode = document.getElementById("mode").value;
      const chap = document.getElementById("chapter").value;

      document.getElementById("altHead").innerHTML = `<span style="background:#e7ecf5;color:#2f4a7a">${escA(set.law)}</span><span class="art">${escA(set.article)}</span>`;
      document.getElementById("altTitle").textContent = set.title;
      document.getElementById("altHint").textContent = set.kind === "multi" ? set.hint : set.kind === "classify" ? set.hint + "每一題點選對應的選項。" : altType === "match" ? set.hint + "先點左邊一項，再點右邊對應的一項；點已配對的項目可取消。" : set.hint + "用 ▲▼ 調整順序。";
      document.getElementById("altPrev").disabled = altIdx[altType] === 0;
      document.getElementById("altNext").disabled = altIdx[altType] === list.length - 1;
      const body = document.getElementById("altBody");
      if (altType === "match" && set.kind === "multi") {
        const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
        body.innerHTML = `<div class="olist">${set.items.map((it, i) => {
          const ok = sameSet(altState.sel[i], it.ans);
          return `<div class="cl${altDone ? (ok ? " ok" : " bad") : ""}"><div class="cl-t"><b>${i + 1}.</b> ${escA(it.text)}</div>
            <div class="mopts">${it.options.map((o, k) => {
              const on = altState.sel[i].includes(k), right = it.ans.includes(k);
              const mark = altDone ? (right ? (on ? " ✓" : " ← 正確答案") : (on ? " ✗" : "")) : "";
              return `<button type="button" class="mopt${on ? " on" : ""}${altDone && right ? " right" : ""}${altDone && on && !right ? " wrong" : ""}" data-mi="${i}" data-mk="${k}">(${k + 1}) ${escA(o)}<b>${mark}</b></button>`;
            }).join("")}</div>${altDone ? `<span class="fix" style="color:${ok ? "#23794a" : "#b3261e"}">答案：${it.ans.map(k => "(" + (k + 1) + ")").join("")}</span>` : ""}</div>`;
        }).join("")}</div>`;
        return;
      }
      if (altType === "match" && set.kind === "classify") {
        body.innerHTML = `<div class="olist">${set.items.map((it, i) => {
          const allOk = set.fields.every((f, k) => altState.pick[i][k] === it.ans[k]);
          const cls = "cl" + (altDone ? (allOk ? " ok" : " bad") : "");
          return `<div class="${cls}"><div class="cl-t"><b>(${i + 1})</b> ${escA(it.text)}</div>${set.fields.map((f, k) => {
            const fix = altDone && altState.pick[i][k] !== it.ans[k] ? `<span class="fix">正確：${escA(it.ans[k])}</span>` : "";
            return `<div class="cl-f"><span class="cl-n">${escA(f.name)}</span><span class="cl-o">${f.options.map(o =>
              `<button type="button" class="chip${altState.pick[i][k] === o ? " on" : ""}" data-ci="${i}" data-ck="${k}" data-cv="${escA(o)}">${escA(o)}</button>`).join("")}</span>${fix}</div>`;
          }).join("")}</div>`;
        }).join("")}</div>`;
        return;
      }
      if (altType === "match") {
        const rightOf = {}; Object.entries(altState.link).forEach(([l, r]) => rightOf[r] = +l);
        const left = set.pairs.map((p, i) => {
          const r = altState.link[i], col = r !== undefined ? COLORS[i % COLORS.length] : "";
          let cls = "mi" + (altSel === i ? " sel" : ""), fix = "";
          if (altDone) { cls += r === i ? " ok" : " bad"; if (r !== i) fix = `<span class="fix">正確：${escA(set.pairs[i][1])}</span>`; }
          return `<button type="button" class="${cls}" data-l="${i}"><span class="tag" style="${col ? `background:${col};color:#fff` : ""}">${String.fromCharCode(65 + i)}</span>${escA(p[0])}${fix}</button>`;
        }).join("");
        const right = altState.right.map(ri => {
          const l = rightOf[ri], col = l !== undefined ? COLORS[l % COLORS.length] : "";
          return `<button type="button" class="mi" data-r="${ri}"><span class="tag" style="${col ? `background:${col};color:#fff` : ""}">${l !== undefined ? String.fromCharCode(65 + l) : "?"}</span>${escA(set.pairs[ri][1])}</button>`;
        }).join("");
        body.innerHTML = `<div class="mgrid"><div class="mcol">${left}</div><div class="mcol">${right}</div></div>`;
      } else {
        body.innerHTML = `<ol class="olist">${altState.ord.map((si, pos) => {
          let cls = "oi", fix = "";
          if (altDone) { cls += si === pos ? " ok" : " bad"; if (si !== pos) fix = `<span class="fix">應排第 ${si + 1}</span>`; }
          return `<li class="${cls}"><span class="n">${pos + 1}</span><span>${escA(set.steps[si])}${fix}</span>
            <span class="mv"><button type="button" data-up="${pos}" ${pos === 0 || altDone ? "disabled" : ""} aria-label="上移">▲</button><button type="button" data-down="${pos}" ${pos === altState.ord.length - 1 || altDone ? "disabled" : ""} aria-label="下移">▼</button></span></li>`;
        }).join("")}</ol>`;
      }
    }
    document.getElementById("altBody").addEventListener("click", e => {
      if (altDone) return;
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.mi !== undefined) {
        const a = altState.sel[+b.dataset.mi], k = +b.dataset.mk, j = a.indexOf(k);
        if (j >= 0) a.splice(j, 1); else a.push(k);
        renderAlt(); return;
      }
      if (b.dataset.ci !== undefined) { altState.pick[+b.dataset.ci][+b.dataset.ck] = b.dataset.cv; renderAlt(); return; }
      if (altType === "match") {
        if (b.dataset.l !== undefined) {
          const l = +b.dataset.l;
          if (altState.link[l] !== undefined && altSel !== l) { delete altState.link[l]; altSel = null; }
          else altSel = altSel === l ? null : l;
        } else if (b.dataset.r !== undefined) {
          const r = +b.dataset.r;
          const owner = Object.keys(altState.link).find(k => altState.link[k] === r);
          if (altSel === null) { if (owner !== undefined) delete altState.link[owner]; }
          else { if (owner !== undefined) delete altState.link[owner]; altState.link[altSel] = r; altSel = null; }
        }
      } else {
        const o = altState.ord;
        if (b.dataset.up !== undefined) { const i = +b.dataset.up; [o[i - 1], o[i]] = [o[i], o[i - 1]]; }
        if (b.dataset.down !== undefined) { const i = +b.dataset.down; [o[i + 1], o[i]] = [o[i], o[i + 1]]; }
      }
      renderAlt();
    });
    function altFb(text, cls){ const f = document.getElementById("altFb"); f.textContent = text; f.className = "alt-fb" + (cls ? " " + cls : ""); }
    document.getElementById("altGrade").onclick = () => {
      const set = curSet();
      if (set.kind === "multi") {
        const empty = altState.sel.filter(a => !a.length).length;
        if (empty) { altFb(`還有 ${empty} 題沒有作答。`); return; }
        altDone = true;
        const ok = set.items.filter((it, i) => altState.sel[i].length === it.ans.length && it.ans.every(k => altState.sel[i].includes(k))).length;
        altScores[set.id] = { ok, total: set.items.length }; altSave();
        altFb(ok === set.items.length ? `全對！${ok} / ${set.items.length} 題` : `答對 ${ok} / ${set.items.length} 題，正確答案已標示。`, ok === set.items.length ? "good" : "bad");
        renderAlt(); return;
      }
      if (set.kind === "classify") {
        const miss = altState.pick.flat().filter(v => v === null).length;
        if (miss) { altFb(`還有 ${miss} 個選項沒有選。`); return; }
        altDone = true;
        const total = set.items.length * set.fields.length;
        const ok = set.items.reduce((n, it, i) => n + it.ans.filter((a, k) => altState.pick[i][k] === a).length, 0);
        altScores[set.id] = { ok, total }; altSave();
        altFb(ok === total ? `全對！${ok} / ${total}` : `答對 ${ok} / ${total}，錯誤處已標示正確答案。`, ok === total ? "good" : "bad");
        renderAlt(); return;
      }
      if (altType === "match" && Object.keys(altState.link).length < set.pairs.length) { altFb(`還有 ${set.pairs.length - Object.keys(altState.link).length} 項沒有配對。`); return; }
      altDone = true;
      const total = altType === "match" ? set.pairs.length : set.steps.length;
      const ok = altType === "match" ? set.pairs.filter((p, i) => altState.link[i] === i).length : altState.ord.filter((s, i) => s === i).length;
      altScores[set.id] = { ok, total }; altSave();
      altFb(ok === total ? `全對！${ok} / ${total}` : `答對 ${ok} / ${total}，錯誤處已標示正確答案。`, ok === total ? "good" : "bad");
      renderAlt();
    };
    document.getElementById("altShow").onclick = () => {
      const set = curSet();
      if (set.kind === "multi") { altState.sel = set.items.map(it => it.ans.slice()); altDone = true; altFb("已顯示正確答案，按「重來」可重新作答。"); renderAlt(); return; }
      if (set.kind === "classify") { altState.pick = set.items.map(it => it.ans.slice()); altDone = true; altFb("已顯示正確答案，按「重來」可重新作答。"); renderAlt(); return; }
      if (altType === "match") { altState.link = {}; set.pairs.forEach((p, i) => altState.link[i] = i); }
      else altState.ord = set.steps.map((s, i) => i);
      altDone = true; altFb("已顯示正確答案，按「重來」可重新作答。"); renderAlt();
    };
    document.getElementById("altReset").onclick = () => { newState(); altFb("作答後按「判分」。"); renderAlt(); };
    document.getElementById("altPrev").onclick = () => { altIdx[altType]--; newState(); altFb("作答後按「判分」。"); renderAlt(); window.scrollTo(0, 0); };
    document.getElementById("altNext").onclick = () => { altIdx[altType]++; newState(); altFb("作答後按「判分」。"); renderAlt(); window.scrollTo(0, 0); };
    document.querySelector(".types").addEventListener("click", e => {
      const b = e.target.closest("button[data-type]"); if (!b) return;
      altType = b.dataset.type;
      document.querySelectorAll(".types button").forEach(x => x.setAttribute("aria-pressed", x === b));
      document.body.classList.toggle("alt", altType !== "fill");
      if (altType !== "fill") { newState(); altFb("作答後按「判分」。"); renderAlt(); }
      window.scrollTo(0, 0);
    });


    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js", { updateViaCache: "none" }).catch(() => {});
    }
    boot();
  </script>
</body>
</html>
